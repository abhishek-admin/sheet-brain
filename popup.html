<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sheet Brain</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    :root { --accent: #34d399; }
    .sheet-bar { display:flex; align-items:center; justify-content:space-between; background:rgba(52,211,153,0.08); border:1px solid rgba(52,211,153,0.2); border-radius:6px; padding:6px 10px; margin-bottom:8px; gap:8px; }
    .sheet-bar-name { color:#34d399; font-size:11px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px; }
    .suggest-btn { background:rgba(52,211,153,0.12); border:1px solid rgba(52,211,153,0.3); color:#34d399; border-radius:4px; padding:3px 9px; font-size:11px; cursor:pointer; white-space:nowrap; flex-shrink:0; }
    .suggest-btn:hover { background:rgba(52,211,153,0.25); }
    .sheet-hint { font-size:11px; color:#6b7280; margin-bottom:8px; text-align:center; padding:5px 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <span class="logo">✦</span>
        <h1>Sheet Brain</h1>
      </div>
      <div class="header-right">
        <span class="badge">Gemini</span>
        <button id="settings-btn" class="settings-btn" title="API Settings">⚙</button>
      </div>
    </div>

    <div id="main-content">
      <!-- Shown when a Google Sheet is open -->
      <div id="sheet-bar" class="sheet-bar hidden">
        <span id="sheet-bar-name" class="sheet-bar-name">📊 Spreadsheet</span>
        <button id="suggest-btn" class="suggest-btn">✨ Suggest formulas</button>
      </div>
      <!-- Shown when NOT on a Google Sheet -->
      <p id="sheet-hint" class="sheet-hint hidden">💡 Open a Google Sheet for smart suggestions</p>

      <textarea id="custom-input" class="settings-input" rows="3" placeholder="Describe the formula you need..." style="margin-top:0;width:100%;resize:vertical;"></textarea>
      <button id="action-btn" class="primary-btn">
        <span class="btn-text">▶ Generate Formula</span>
      </button>
    </div>

    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <p class="loading-text">Generating functions...</p>
    </div>

    <div id="result" class="hidden">
      <div class="result-header">
        <span>Functions</span>
        <div class="result-actions">
          <button id="copy-btn" class="copy-btn" title="Copy to clipboard">📋</button>
        </div>
      </div>
      <div id="result-content" class="result-content"></div>
      <button id="rerun-btn" class="rerun-btn">↻ Regenerate</button>
    </div>

    <div id="error" class="hidden">
      <p class="error-text" id="error-message">Something went wrong.</p>
      <button id="retry-btn" class="secondary-btn">Retry</button>
    </div>

    <div id="settings-panel" class="hidden">
      <div class="settings-header">
        <span>API Settings</span>
        <button id="settings-close" class="settings-close">✕</button>
      </div>
      <div class="settings-body">
        <label class="settings-label">Gemini API Key</label>
        <div class="settings-row">
          <input type="password" id="gemini-key-input" class="settings-input" placeholder="Paste Gemini key..." />
          <button id="toggle-gemini-key" class="toggle-vis-btn">👁</button>
        </div>
        <label class="settings-label">OpenRouter API Key <span class="settings-hint">(fallback)</span></label>
        <div class="settings-row">
          <input type="password" id="openrouter-key-input" class="settings-input" placeholder="Paste OpenRouter key..." />
          <button id="toggle-openrouter-key" class="toggle-vis-btn">👁</button>
        </div>
        <div class="settings-actions">
          <button id="save-keys-btn" class="primary-btn" style="padding:8px 12px;font-size:12px;">Save Keys</button>
          <button id="clear-keys-btn" class="secondary-btn">Clear All Keys</button>
        </div>
      </div>
    </div>

    <div class="footer">
      <span>Built by <a href="https://x.com/happy_ships" target="_blank">@happy_ships</a></span>
      <span>Day 5/180</span>
    </div>
  </div>

  <script src="gemini.js"></script>
  <script src="popup.js"></script>
</body>
</html>
