<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sheet Brain</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    :root { --accent: #34d399; }
    #onboarding { display: flex; flex-direction: column; gap: 10px; }
    .onboarding-title { font-size: 15px; font-weight: 700; color: #e0e0e8; }
    .onboarding-desc { font-size: 12px; color: #8888a0; line-height: 1.65; }
    .onboarding-desc strong { color: #c8c8dc; }
    .onboard-field { display: flex; flex-direction: column; gap: 5px; }
    .settings-hint a { color: var(--accent); text-decoration: none; }
    .settings-hint a:hover { text-decoration: underline; }

    /* ── Insight header: domain badge + stat chips ── */
    .insight-header {
      display: flex; flex-wrap: wrap; gap: 5px;
      margin-bottom: 10px; padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .domain-badge {
      font-size: 11px; font-weight: 700; letter-spacing: 0.3px;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
      padding: 3px 9px; border-radius: 20px;
    }
    .stat-chip {
      font-size: 10px; color: #7878a0;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 3px 8px; border-radius: 20px;
    }
    .stat-chip strong { color: #b0b0c8; font-weight: 600; }

    /* ── The Story callout ── */
    .story-callout {
      background: color-mix(in srgb, var(--accent) 6%, transparent);
      border-left: 3px solid var(--accent);
      border-radius: 0 6px 6px 0;
      padding: 9px 12px; margin: 4px 0 10px;
      font-size: 12.5px; color: #d0d8d4;
      line-height: 1.65; font-style: italic;
    }
    .story-callout p { margin: 0; }

    /* ── Top 3 Aha Moments numbered cards ── */
    .aha-list ol {
      list-style: none; padding: 0; margin: 0;
      counter-reset: aha; display: flex; flex-direction: column; gap: 5px;
    }
    .aha-list ol li {
      counter-increment: aha;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 8px 10px 8px 34px;
      font-size: 12.5px; color: #d0d0dc;
      line-height: 1.5; position: relative;
    }
    .aha-list ol li::before {
      content: counter(aha);
      position: absolute; left: 9px; top: 8px;
      width: 17px; height: 17px;
      background: var(--accent); color: #000;
      font-size: 10px; font-weight: 700; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Inline loading text while stats show ── */
    .loading-inline {
      font-size: 12px; color: var(--accent); margin-top: 8px;
      opacity: 0.8; animation: pulse 1.5s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <span class="logo">✦</span>
        <h1>Sheet Brain</h1>
      </div>
      <div class="header-right">
        <span class="badge">Gemini</span>
        <button id="settings-btn" class="settings-btn" title="API Settings">⚙</button>
      </div>
    </div>

    <div id="main-content">
      <p class="subtitle">Copy your sheet data and paste it below</p>
      <textarea id="custom-input" class="settings-input" rows="5" placeholder="Ctrl+A → Ctrl+C from any spreadsheet, paste here..." style="margin-top:6px;width:100%;resize:vertical;font-family:monospace;font-size:11px;"></textarea>
      <button id="action-btn" class="primary-btn">
        <span class="btn-text">▶ Analyse Sheet</span>
      </button>
    </div>

    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <p class="loading-text">Analysing data...</p>
    </div>

    <div id="result" class="hidden">
      <div class="result-header">
        <span>Data Insights</span>
        <div class="result-actions">
          <button id="copy-btn" class="copy-btn" title="Copy to clipboard">📋</button>
        </div>
      </div>
      <div id="result-content" class="result-content"></div>
      <button id="rerun-btn" class="rerun-btn">↻ Re-analyse</button>
    </div>

    <div id="error" class="hidden">
      <p class="error-text" id="error-message">Something went wrong.</p>
      <button id="retry-btn" class="secondary-btn">Retry</button>
    </div>

    <div id="onboarding" class="hidden">
      <p class="onboarding-title">👋 Welcome! Add your API key</p>
      <p class="onboarding-desc">Enter a <strong>Gemini</strong> or <strong>OpenRouter</strong> key to get started. Either one works — you don't need both.</p>
      <div class="onboard-field">
        <label class="settings-label">Gemini API Key <span class="settings-hint">— <a href="https://aistudio.google.com/app/apikey" target="_blank">Get free key ↗</a></span></label>
        <div class="settings-row">
          <input type="password" id="onboard-gemini-input" class="settings-input" placeholder="AIza..." />
          <button id="onboard-toggle-gemini" class="toggle-vis-btn">👁</button>
        </div>
      </div>
      <div class="onboard-field">
        <label class="settings-label">OpenRouter API Key <span class="settings-hint">— <a href="https://openrouter.ai/keys" target="_blank">Get key ↗</a></span></label>
        <div class="settings-row">
          <input type="password" id="onboard-openrouter-input" class="settings-input" placeholder="sk-or-..." />
          <button id="onboard-toggle-openrouter" class="toggle-vis-btn">👁</button>
        </div>
      </div>
      <button id="onboard-save-btn" class="primary-btn">Get Started →</button>
    </div>

    <div id="settings-panel" class="hidden">
      <div class="settings-header">
        <span>API Settings</span>
        <button id="settings-close" class="settings-close">✕</button>
      </div>
      <div class="settings-body">
        <label class="settings-label">Gemini API Key</label>
        <div class="settings-row">
          <input type="password" id="gemini-key-input" class="settings-input" placeholder="Paste Gemini key..." />
          <button id="toggle-gemini-key" class="toggle-vis-btn">👁</button>
        </div>
        <label class="settings-label">OpenRouter API Key <span class="settings-hint">(fallback)</span></label>
        <div class="settings-row">
          <input type="password" id="openrouter-key-input" class="settings-input" placeholder="Paste OpenRouter key..." />
          <button id="toggle-openrouter-key" class="toggle-vis-btn">👁</button>
        </div>
        <div class="settings-actions">
          <button id="save-keys-btn" class="primary-btn" style="padding:8px 12px;font-size:12px;">Save Keys</button>
          <button id="clear-keys-btn" class="secondary-btn">Clear All Keys</button>
        </div>
      </div>
    </div>

    <div class="footer">
      <span>Built by <a href="https://x.com/happy_ships" target="_blank">@happy_ships</a></span>
      <span>Day 5/180</span>
    </div>
  </div>

  <script src="gemini.js"></script>
  <script src="popup.js"></script>
</body>
</html>
